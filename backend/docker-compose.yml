services:
  app:
    build:
      context: .
    container_name: ascensores_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ascensores
      DB_USERNAME: ascensores_user
      DB_PASSWORD: ascensores_pass
      DB_CONNECTION: pgsql
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:16
    container_name: ascensores_db
    restart: always
    environment:
      POSTGRES_DB: ascensores
      POSTGRES_USER: ascensores_user
      POSTGRES_PASSWORD: ascensores_pass
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascensores_user -d ascensores"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: ascensores_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ascensores.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge