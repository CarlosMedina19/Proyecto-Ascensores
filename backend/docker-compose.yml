services:
  app:
    build:
      context: .
    container_name: ascensores_app
    restart: always 
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - app_network
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:16
    container_name: ascensores_db
    restart: always
    environment:
      POSTGRES_DB: ascensores
      POSTGRES_USER: ascensores_user
      POSTGRES_PASSWORD: ascensores_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ascensores_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ascensores.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge