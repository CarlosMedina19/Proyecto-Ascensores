# SIGMA · Gestión y mantenimiento de ascensores.
# En Docker Desktop aparece como "proyecto_ascensores" (Compose solo admite minúsculas en el nombre).
name: proyecto_ascensores

services:
  app:
    build:
      context: .
    container_name: ascensores_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ascensores
      DB_USERNAME: ascensores_user
      DB_PASSWORD: ascensores_pass
      DB_CONNECTION: pgsql
      # El servidor de desarrollo atiende varias solicitudes a la vez (panel y app piden en paralelo).
      PHP_CLI_SERVER_WORKERS: 6
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  # Cola de avisos: envía los correos y las notificaciones de la aplicación.
  queue:
    build:
      context: .
    container_name: ascensores_queue
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ascensores
      DB_USERNAME: ascensores_user
      DB_PASSWORD: ascensores_pass
      DB_CONNECTION: pgsql
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600

  # Tareas diarias: vigencias (00:15), avisos de mantenimiento y contratos (07:00) y certificación anual (07:10).
  scheduler:
    build:
      context: .
    container_name: ascensores_scheduler
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ascensores
      DB_USERNAME: ascensores_user
      DB_PASSWORD: ascensores_pass
      DB_CONNECTION: pgsql
    command: php artisan schedule:work

  db:
    image: postgres:16
    container_name: ascensores_db
    restart: always
    environment:
      POSTGRES_DB: ascensores
      POSTGRES_USER: ascensores_user
      POSTGRES_PASSWORD: ascensores_pass
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascensores_user -d ascensores"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visor de la base de datos (http://localhost:5050). Ya trae registrada la conexión "SIGMA".
  pgadmin:
    image: dpage/pgadmin4
    container_name: ascensores_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ascensores.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  # Se fija el nombre del volumen para conservar los datos de antes del cambio de nombre del proyecto.
  db_data:
    name: backend_db_data
  pgadmin_data:

networks:
  app_network:
    driver: bridge