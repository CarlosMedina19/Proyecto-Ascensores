# SIGMA en producción (VPS): https://sigma.proyectoscampus.top
# Caddy (en /opt/proxy, red "proxy") recibe el tráfico: /api/* y /up van a sigma_backend y el resto
# a sigma_frontend. La base de datos queda en la red privada del proyecto y no publica puertos.
# Las variables están en backend/.env de la VPS (ver .env.produccion.example); nunca se suben a Git.
#
# Uso en la VPS:  cd /opt/apps/sigma/backend && docker compose -f docker-compose.prod.yml up -d --build
# Para desarrollo local se sigue usando docker-compose.yml.
name: sigma

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.prod
  image: sigma-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: sigma_db
    DB_PORT: 5432
  volumes:
    - sigma_archivos:/var/www/html/storage/app
  depends_on:
    sigma_db:
      condition: service_healthy

services:
  sigma_backend:
    <<: *backend
    container_name: sigma_backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: sigma_db
      DB_PORT: 5432
      SIGMA_ROL: web
    networks:
      - proxy
      - sigma_interna

  # Envía los correos y avisos encolados.
  sigma_queue:
    <<: *backend
    container_name: sigma_queue
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: sigma_db
      DB_PORT: 5432
      SIGMA_ROL: cola
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan queue:work --tries=3 --sleep=3 --max-time=3600"]
    networks:
      - sigma_interna

  # Tareas diarias: vigencias, avisos de mantenimiento, contratos y certificación anual.
  sigma_scheduler:
    <<: *backend
    container_name: sigma_scheduler
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: sigma_db
      DB_PORT: 5432
      SIGMA_ROL: programador
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    networks:
      - sigma_interna

  # WebSocket (Laravel Reverb) para Auditoría en vivo y la campana de notificaciones. El panel lo publica
  # en /app/ (nginx de sigma_frontend); Laravel le envía los eventos por la red interna.
  sigma_reverb:
    <<: *backend
    container_name: sigma_reverb
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: sigma_db
      DB_PORT: 5432
      SIGMA_ROL: tiempo_real
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan reverb:start --host=0.0.0.0 --port=8080"]
    networks:
      - sigma_interna

  # Microservicio de analítica en Python (FastAPI + Pandas + scikit-learn). Solo red interna, sin puertos:
  # Laravel lo llama con la clave ANALITICA_CLAVE.
  sigma_analitica:
    build:
      context: ../analitica
    image: sigma-analitica:latest
    container_name: sigma_analitica
    restart: unless-stopped
    environment:
      ANALITICA_CLAVE: ${ANALITICA_CLAVE}
    mem_limit: 512m
    networks:
      - sigma_interna

  sigma_frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api/v1
        VITE_REVERB_KEY: ${REVERB_APP_KEY:-}
    image: sigma-frontend:latest
    container_name: sigma_frontend
    restart: unless-stopped
    volumes:
      # APK de la app: se copia a backend/descargas en el servidor y queda en /descargas/sigma.apk.
      - ./descargas:/usr/share/nginx/html/descargas:ro
    networks:
      - proxy
      # Para llegar a sigma_reverb (WebSocket en /app/).
      - sigma_interna

  sigma_db:
    image: postgres:16-alpine
    container_name: sigma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sigma_pgdata:/var/lib/postgresql/data
    networks:
      - sigma_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # RNF-06: respaldo diario de la base de datos y de los archivos en backend/respaldos (14 días).
  sigma_respaldos:
    image: postgres:16-alpine
    container_name: sigma_respaldos
    restart: unless-stopped
    entrypoint: ["sh", "/respaldo.sh"]
    environment:
      TZ: America/Bogota
      PGHOST: sigma_db
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      RESPALDO_HORA: 3
      RESPALDO_DIAS: 14
    volumes:
      - ./docker/respaldo.sh:/respaldo.sh:ro
      - ./respaldos:/respaldos
      - sigma_archivos:/archivos:ro
    networks:
      - sigma_interna
    depends_on:
      sigma_db:
        condition: service_healthy

volumes:
  sigma_pgdata:
    name: sigma_pgdata
  sigma_archivos:
    name: sigma_archivos

networks:
  # Red compartida con Caddy (ya existe en la VPS).
  proxy:
    external: true
  # Red privada de SIGMA: base de datos, cola, programador, tiempo real y analítica.
  sigma_interna:
    name: sigma_interna
