<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sigma.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SIGMA — Sistema Integral de Gestión y Mantenimiento de Ascensores" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:wght@600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        const tema = localStorage.getItem('sigma.tema');
        if (tema) document.documentElement.setAttribute('data-tema', tema);
      } catch (e) {}
    </script>
    <title>SIGMA · Gestión de ascensores</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
