# Encabezados de seguridad del panel. Se incluye en cada "location" de nginx.conf porque un add_header
# dentro de una location anula los del bloque server.

# El navegador respeta el tipo de cada archivo y no interpreta una imagen como script.
add_header X-Content-Type-Options "nosniff" always;
# El panel no se puede incrustar en un iframe de otro sitio (clickjacking).
add_header X-Frame-Options "DENY" always;
# A otros sitios solo se envía el dominio, nunca la ruta completa.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Solo el propio panel puede pedir la ubicación (seguimiento del técnico); nunca cámara ni micrófono.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# El sitio se sirve solo por HTTPS (Caddy); el navegador no vuelve a intentar HTTP durante un año.
add_header Strict-Transport-Security "max-age=31536000" always;

# Política de contenido (CSP): de dónde se pueden cargar scripts, estilos, imágenes y conexiones.
# Si alguien lograra inyectar HTML, el navegador no ejecutaría scripts de otros orígenes ni enviaría
# datos a servidores ajenos.
#   - script-src 'self': solo los archivos del panel (sin scripts en línea).
#   - style-src: el panel, Google Fonts y estilos en línea (los usan React y Leaflet).
#   - img-src: el panel, imágenes data:/blob: (fotos y previsualizaciones) y los mapas de OpenStreetMap.
#   - connect-src: la API del mismo dominio y el WebSocket de Reverb.
# Se publica primero en modo "Report-Only": el navegador no bloquea nada, solo avisa en la consola cada
# recurso que la política habría bloqueado. Cuando el panel funcione sin avisos en producción, se cambia
# el nombre del encabezado a "Content-Security-Policy" para que se aplique.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' wss://$host; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
