# Panel de SIGMA: aplicación de una sola página. Toda ruta que no sea un archivo vuelve a index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Archivos con huella en el nombre (assets/…): se guardan en caché un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # APK de la app para Android (carpeta del servidor montada en el contenedor; no va en la imagen).
    location /descargas/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # WebSocket de Laravel Reverb (Auditoría en vivo y notificaciones). Solo /app/: la API HTTP de
    # Reverb (/apps/) queda en la red interna. Se resuelve en cada conexión para que nginx arranque
    # aunque sigma_reverb aún no esté listo.
    location /app/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reverb http://sigma_reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        # index.html nunca en caché, para que cada despliegue se vea de inmediato.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
