# Panel de SIGMA: aplicación de una sola página. Toda ruta que no sea un archivo vuelve a index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Archivos con huella en el nombre (assets/…): se guardan en caché un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html nunca en caché, para que cada despliegue se vea de inmediato.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
