# Panel de SIGMA: aplicación de una sola página. Las rutas del panel vuelven a index.html.

# Primer segmento de cada ruta del panel (frontend/src/App.jsx). Cualquier otra dirección responde 404
# (con el panel, que muestra «Página no encontrada»): un enlace roto o un escáner no reciben un 200 falso.
# Al agregar una sección nueva al panel, agregue aquí su primer segmento.
map $uri $ruta_del_panel {
    default 0;
    "/" 1;
    "~^/(auditoria|calendario|cartera|certificaciones|clientes|configuracion|conjuntos|contratos|cotizaciones|edificios|emergencias|equipos|indicadores|iniciar-sesion|inicio|inventario|ordenes|pagos|perfil|planes|recuperar-contrasena|reportar|restablecer-contrasena|roles|tecnicos|usuarios)(/|$)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Archivos con huella en el nombre (assets/…): se guardan en caché un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # APK de la app para Android (carpeta del servidor montada en el contenedor; no va en la imagen).
    location /descargas/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # WebSocket de Laravel Reverb (Auditoría en vivo y notificaciones). Solo /app/: la API HTTP de
    # Reverb (/apps/) queda en la red interna. Se resuelve en cada conexión para que nginx arranque
    # aunque sigma_reverb aún no esté listo.
    location /app/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reverb http://sigma_reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        # index.html nunca en caché, para que cada despliegue se vea de inmediato.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;

        # OPTIONS: el panel dice qué métodos acepta (es contenido estático: GET y HEAD).
        if ($request_method = OPTIONS) {
            add_header Allow "GET, HEAD, OPTIONS" always;
            include /etc/nginx/snippets/seguridad.conf;
            return 204;
        }
        # POST, PUT, DELETE…: 405 con el encabezado Allow, como pide el estándar HTTP.
        error_page 405 = @metodo_no_permitido;

        try_files $uri $uri/ @panel;
    }

    # Rutas del panel: index.html. Otras: 404 con index.html como cuerpo (la página de «no encontrada»).
    location @panel {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;
        error_page 404 /index.html;
        if ($ruta_del_panel = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
    }

    location @metodo_no_permitido {
        add_header Allow "GET, HEAD, OPTIONS" always;
        include /etc/nginx/snippets/seguridad.conf;
        return 405;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
