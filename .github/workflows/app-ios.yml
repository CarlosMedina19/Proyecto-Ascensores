# App de SIGMA para iPhone (iOS), hecha en Flutter.
# Compilar para iOS exige una Mac: GitHub presta una máquina macOS 15 con Xcode (gratis en repositorios
# públicos). Flutter genera el proyecto de Xcode (no hace falta XcodeGen) y el flujo:
#   1. verifica macOS, Xcode y Flutter;
#   2. corre las pruebas de la app;
#   3. compila para el simulador de iOS (Runner.app de simulador);
#   4. compila para iPhone sin firma (Runner.app de dispositivo) y lo empaqueta como IPA (Payload/Runner.app);
#   5. publica tres artefactos por 30 días: SIGMA-iOS-IPA, SIGMA-iOS-Simulador y SIGMA-iOS-Dispositivo.
# El IPA va SIN FIRMA: Apple solo instala apps firmadas. Se firma con Sideloadly o AltStore (Apple ID
# gratuito, 7 días) o, con la cuenta de desarrollador (USD 99 al año), por TestFlight o la App Store.
# Se ejecuta a mano (Actions → App iOS → Run workflow) o al cambiar la app en main.
name: App iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/flutter_application_1/**'
      - '.github/workflows/app-ios.yml'

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: Compilar SIGMA para iPhone (Flutter)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/flutter_application_1
    steps:
      - uses: actions/checkout@v7

      - name: Verificar macOS y Xcode
        run: |
          sw_vers
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Dependencias
        run: |
          flutter --version
          flutter pub get

      - name: Pruebas
        run: flutter test

      # Para el simulador de iOS (no sirve para un iPhone físico). El simulador solo acepta compilación de depuración.
      - name: Compilar para el simulador de iOS
        run: flutter build ios --simulator --debug --dart-define=API_URL=https://sigma.proyectoscampus.top/api/v1

      # Para iPhone, en modo release y sin firma. La versión sale de pubspec.yaml (la misma del APK).
      - name: Compilar para iPhone (sin firma)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/simbolos \
            --dart-define=API_URL=https://sigma.proyectoscampus.top/api/v1

      - name: Verificar las aplicaciones compiladas
        run: |
          for APP in build/ios/iphonesimulator/Runner.app build/ios/iphoneos/Runner.app; do
            if [ ! -d "$APP" ]; then
              echo "ERROR: no se encontró $APP"
              exit 1
            fi
            echo "OK: $APP"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"
          done

      - name: Empaquetar el IPA sin firma
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SIGMA-ios-sin-firmar.ipa Payload
          ls -lh SIGMA-ios-sin-firmar.ipa

      - name: Publicar el IPA
        uses: actions/upload-artifact@v7
        with:
          name: SIGMA-iOS-IPA
          path: app/flutter_application_1/SIGMA-ios-sin-firmar.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publicar la app del simulador
        uses: actions/upload-artifact@v7
        with:
          name: SIGMA-iOS-Simulador
          path: app/flutter_application_1/build/ios/iphonesimulator/Runner.app
          retention-days: 30
          if-no-files-found: error

      - name: Publicar la app de dispositivo
        uses: actions/upload-artifact@v7
        with:
          name: SIGMA-iOS-Dispositivo
          path: app/flutter_application_1/build/ios/iphoneos/Runner.app
          retention-days: 30
          if-no-files-found: error
